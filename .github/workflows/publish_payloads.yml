name: Build and Publish Payloads to R2

on:
  workflow_dispatch: # Manual trigger
    inputs:
      artifact_ref:
        description: "W&B artifact ref (e.g., entity/project/name:v0)"
        required: false
      all_artifacts:
        description: "Process all artifacts in collection"
        type: boolean
        default: false

jobs:
  build-and-upload:
    runs-on: [self-hosted, gpu, payload-builder] # Target GPU server runner
    env:
      PAYLOAD_DIR: artifacts/payload_staging/runs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Link host data directory
        run: |
          if [ -d "/data" ]; then
            for dir in /data/*; do
              if [ -d "$dir" ]; then
                ln -sf "$dir" "./data/$(basename "$dir")"
              fi
            done
            echo "Successfully linked /data subdirectories into ./data/"
          else
            echo "No /data volume found. Running with default data directory."
          fi




      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean stale local payloads
        run: |
          mkdir -p "$PAYLOAD_DIR"
          rm -rf "$PAYLOAD_DIR"/*

      - name: Export paginated payload
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          ARGS="--config configs/analysis/analysis.yaml \
                --output_dir $PAYLOAD_DIR"

          if [ "${{ github.event.inputs.all_artifacts }}" == "true" ]; then
            ARGS="$ARGS --all_artifacts"
          elif [ -n "${{ github.event.inputs.artifact_ref }}" ]; then
            ARGS="$ARGS --artifact ${{ github.event.inputs.artifact_ref }}"
          fi

          python src/export_paginated_payload.py $ARGS

      - name: Build run registry
        run: |
          python scripts/build_run_registry.py "$PAYLOAD_DIR"

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python scripts/upload_to_r2.py \
            --runs-dir "$PAYLOAD_DIR" \
            --prefix runs \
            --delete-extra \
            --yes

      - name: Clean up local payloads
        if: always()
        run: |
          rm -rf "$PAYLOAD_DIR"/*
          echo "Payloads published to R2 and local artifacts cleaned up"
