<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIT Diagrams — Calibration Comparison</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FFFFFF;
      font-family: 'Inter', system-ui, sans-serif;
      color: #171717;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .figure-container {
      width: 100%;
      max-width: 1600px;
    }

    .figure-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 2px solid #E5E5E7;
      background: #FFFFFF;
    }

    .figure-title { font-size: 28px; font-weight: 700; color: #171717; }
    .figure-title .accent { color: #F97316; }

    .figure-subtitle {
      font-size: 16px;
      color: #A3A3A3;
      font-weight: 400;
      margin-top: 6px;
    }

    .diagrams-container {
      display: flex;
      flex-direction: column;
      gap: 60px;
      flex: 1;
      align-items: center;
      justify-content: center;
    }

    .pit-panel {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pit-label {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #A3A3A3;
      margin-bottom: 12px;
    }

    .pit-label.underdispersed { color: #DC2626; }
    .pit-label.calibrated { color: #16A34A; }

    .run-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #A3A3A3;
      border: 1px solid #E5E5E7;
      border-radius: 6px;
      padding: 4px 8px;
      margin-top: 8px;
    }

    svg {
      border: 1px solid #E5E5E7;
      border-radius: 12px;
      background: #FAFAFA;
    }

    .bar { transition: opacity 0.2s; }
    .bar:hover { opacity: 0.8; cursor: pointer; }

    .uniform-line {
      stroke: #A3A3A3;
      stroke-width: 2;
      stroke-dasharray: 4 3;
      opacity: 0.6;
    }

    .axis path, .axis line { stroke: #D4D4D4; }
    .axis text { fill: #525252; font-size: 11px; font-family: 'Inter', sans-serif; }

    .label-text {
      fill: #171717;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
    }

    .stats-overlay {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 20px;
    }

    .stat-pill {
      background: #FAFAFA;
      border: 1px solid #E5E5E7;
      border-radius: 8px;
      padding: 8px 16px;
      text-align: center;
    }

    .stat-pill .value {
      font-size: 16px;
      font-weight: 700;
      color: #F97316;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-pill .label {
      font-size: 9px;
      color: #A3A3A3;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="figure-container">
    <div class="figure-header">
      <div>
        <div class="figure-title">
          <span class="accent">Probability Integral Transform</span> Diagrams
        </div>
        <div class="figure-subtitle">
          Calibration comparison · Underdispersion vs Well-Calibrated ZINB predictions
        </div>
      </div>
    </div>

    <div class="diagrams-container" id="diagrams-container"></div>
  </div><!-- /.figure-container -->

  <script>
    // PIT data from build_figure_data.py
    // Fallback to empty object if file doesn't exist (generates synthetic data)
    d3.json('data/pit.json')
      .then(render)
      .catch(err => {
        console.warn('pit.json not found, using synthetic data:', err);
        render({});
      });

    function render(data) {
      const container = d3.select('#diagrams-container');

      // Generate synthetic PIT histograms if not in data (fallback for demo)
      // In production, these come from actual model validation metrics
      const configs = [
        {
          key: 'underdispersed',
          label: 'Underdispersed',
          className: 'underdispersed',
          color: '#DC2626',
          // Underdispersion: PIT values cluster around 0.5 (predictions too confident)
          generatePIT: () => {
            const bins = 10;
            const pit = Array(bins).fill(0);
            const samples = 1000;
            for (let i = 0; i < samples; i++) {
              const u = Math.random();
              // Beta(5, 5) centered at 0.5 for underdispersion
              const beta = d3.randomBeta(5, 5)();
              const bin = Math.min(Math.floor(beta * bins), bins - 1);
              pit[bin]++;
            }
            return pit.map(c => c / samples);
          }
        },
        {
          key: 'calibrated',
          label: 'Well-Calibrated',
          className: 'calibrated',
          color: '#16A34A',
          // Good calibration: uniform PIT distribution
          generatePIT: () => {
            const bins = 10;
            const pit = Array(bins).fill(0);
            const samples = 1000;
            for (let i = 0; i < samples; i++) {
              const u = Math.random(); // uniform
              const bin = Math.min(Math.floor(u * bins), bins - 1);
              pit[bin]++;
            }
            return pit.map(c => c / samples);
          }
        }
      ];

      configs.forEach(cfg => {
        const runData = data[cfg.key] || {};
        const pitHist = runData.pit_histogram && runData.pit_histogram.length > 0
          ? runData.pit_histogram
          : cfg.generatePIT();

        const panel = container.append('div').attr('class', 'pit-panel');
        panel.append('div')
          .attr('class', `pit-label ${cfg.className}`)
          .text(cfg.label);

        const width = 700, height = 450;
        const margin = { top: 20, right: 20, bottom: 50, left: 70 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;

        const svg = panel.append('svg')
          .attr('width', width)
          .attr('height', height);

        const g = svg.append('g')
          .attr('transform', `translate(${margin.left}, ${margin.top})`);

        const bins = pitHist.length;
        const binWidth = 1 / bins;
        const barData = pitHist.map((count, i) => ({
          x: i * binWidth,
          width: binWidth,
          count,
        }));

        const xScale = d3.scaleLinear().domain([0, 1]).range([0, innerW]);
        const yScale = d3.scaleLinear()
          .domain([0, Math.max(d3.max(pitHist) * 1.1, 0.15)])
          .range([innerH, 0]);

        // Uniform reference line
        g.append('line')
          .attr('class', 'uniform-line')
          .attr('x1', 0)
          .attr('x2', innerW)
          .attr('y1', yScale(1 / bins))
          .attr('y2', yScale(1 / bins));

        // Bars
        g.selectAll('.bar')
          .data(barData)
          .join('rect')
            .attr('class', 'bar')
            .attr('x', d => xScale(d.x))
            .attr('y', d => yScale(d.count))
            .attr('width', xScale(binWidth) - 1)
            .attr('height', d => innerH - yScale(d.count))
            .attr('fill', cfg.color)
            .attr('opacity', 0.8);

        // Axes
        const xAxis = d3.axisBottom(xScale).ticks(5).tickFormat(d3.format('.1f'));
        const yAxis = d3.axisLeft(yScale).ticks(5).tickFormat(d3.format('.2f'));

        g.append('g')
          .attr('class', 'axis')
          .attr('transform', `translate(0, ${innerH})`)
          .call(xAxis)
          .append('text')
            .attr('class', 'label-text')
            .attr('x', innerW / 2)
            .attr('y', 35)
            .text('PIT Value');

        g.append('g')
          .attr('class', 'axis')
          .call(yAxis)
          .append('text')
            .attr('class', 'label-text')
            .attr('transform', 'rotate(-90)')
            .attr('x', -innerH / 2)
            .attr('y', -40)
            .text('Density');

        // Stats
        const statsDiv = panel.append('div').attr('class', 'stats-overlay');
        if (runData.run_id) {
          statsDiv.append('div').attr('class', 'run-badge').text(runData.run_id);
        }
        if (runData.val_mae != null) {
          const pill = statsDiv.append('div').attr('class', 'stat-pill');
          pill.append('div').attr('class', 'value').text(runData.val_mae.toFixed(2));
          pill.append('div').attr('class', 'label').text('Val MAE');
        }
        if (runData.val_rmse != null) {
          const pill = statsDiv.append('div').attr('class', 'stat-pill');
          pill.append('div').attr('class', 'value').text(runData.val_rmse.toFixed(2));
          pill.append('div').attr('class', 'label').text('Val RMSE');
        }
        if (runData.val_zero_acc != null) {
          const pill = statsDiv.append('div').attr('class', 'stat-pill');
          pill.append('div').attr('class', 'value').text((runData.val_zero_acc * 100).toFixed(1) + '%');
          pill.append('div').attr('class', 'label').text('Zero Accuracy');
        }
      });
    }
  </script>
</body>
</html>
