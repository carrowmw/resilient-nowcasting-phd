<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edge-Enriched Kriging Map</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FFFFFF;
      font-family: 'Inter', system-ui, sans-serif;
      color: #171717;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .figure-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid #E5E5E7;
      background: #FFFFFF;
      z-index: 10;
    }

    .figure-title {
      font-size: 18px;
      font-weight: 700;
      color: #171717;
    }

    .figure-title .accent { color: #F97316; }

    .figure-subtitle {
      font-size: 12px;
      color: #A3A3A3;
      font-weight: 400;
      margin-top: 2px;
    }

    .legend-bar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .gradient-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #525252;
    }

    .gradient-bar {
      width: 120px;
      height: 12px;
      border-radius: 3px;
      background: linear-gradient(to right, #3B82F6, #22C55E, #F97316, #DC2626);
    }

    .legend-dots {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #525252;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 4px;
    }

    .legend-dot-sim {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 4px;
      border: 2px dashed #F97316;
      background: transparent;
    }

    #map {
      flex: 1;
      min-height: 0;
    }

    .maplibregl-ctrl-attrib { display: none !important; }

    .node-popup {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.5;
    }

    .node-popup strong { color: #F97316; }

    .node-popup .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .stats-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 12px;
      z-index: 5;
    }

    .stat-pill {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #E5E5E7;
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat-pill .value {
      font-size: 18px;
      font-weight: 800;
      color: #F97316;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-pill .label {
      font-size: 9px;
      color: #A3A3A3;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="figure-header">
    <div>
      <div class="figure-title">
        <span class="accent">Edge-Enriched</span> Spatial Kriging
      </div>
      <div class="figure-subtitle">
        OSMnx road network · Walking path segments · Kriging decoder predictions
      </div>
    </div>
    <div class="legend-bar">
      <div class="gradient-legend">
        <span>Low</span>
        <div class="gradient-bar"></div>
        <span>High</span>
        <span style="margin-left: 4px; color: #A3A3A3;">Predicted count</span>
      </div>
      <div class="legend-dots">
        <span><span class="legend-dot" style="background: #F97316;"></span>Physical sensor</span>
        <span><span class="legend-dot-sim"></span>Simulated node</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div class="stats-overlay">
    <div class="stat-pill">
      <div class="value">15</div>
      <div class="label">Physical sensors</div>
    </div>
    <div class="stat-pill">
      <div class="value">8</div>
      <div class="label">Simulated nodes</div>
    </div>
    <div class="stat-pill">
      <div class="value">42</div>
      <div class="label">Road segments</div>
    </div>
  </div>

  <script>
    // ── Newcastle centre coordinates ──
    const CENTER = [-1.6132, 54.9783];
    const ZOOM = 14.2;

    // ── Generate mock sensor + simulated node positions ──
    const rng = (function(seed) {
      let s = seed;
      return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    })(42);

    const sensorLocations = [
      { lng: -1.6165, lat: 54.9740, name: 'Grey St_01', simulated: false },
      { lng: -1.6130, lat: 54.9755, name: 'Monument_02', simulated: false },
      { lng: -1.6095, lat: 54.9773, name: 'Pilgrim St_03', simulated: false },
      { lng: -1.6180, lat: 54.9782, name: 'Grainger_04', simulated: false },
      { lng: -1.6110, lat: 54.9800, name: 'Haymarket_05', simulated: false },
      { lng: -1.6050, lat: 54.9745, name: 'Quayside_06', simulated: false },
      { lng: -1.6200, lat: 54.9760, name: 'Central Stn_07', simulated: false },
      { lng: -1.6070, lat: 54.9810, name: 'Northumberland_08', simulated: false },
      { lng: -1.6150, lat: 54.9720, name: 'Dean St_09', simulated: false },
      { lng: -1.6085, lat: 54.9725, name: 'Side_10', simulated: false },
      { lng: -1.6140, lat: 54.9795, name: 'Eldon Sq_11', simulated: false },
      { lng: -1.6025, lat: 54.9770, name: 'Manors_12', simulated: false },
      { lng: -1.6175, lat: 54.9815, name: 'Claremont_13', simulated: false },
      { lng: -1.6210, lat: 54.9735, name: 'Westgate_14', simulated: false },
      { lng: -1.6060, lat: 54.9790, name: 'New Bridge_15', simulated: false },
      // Simulated nodes (out-of-sample kriging targets)
      { lng: -1.6148, lat: 54.9768, name: 'SIM_A', simulated: true },
      { lng: -1.6100, lat: 54.9740, name: 'SIM_B', simulated: true },
      { lng: -1.6190, lat: 54.9770, name: 'SIM_C', simulated: true },
      { lng: -1.6120, lat: 54.9818, name: 'SIM_D', simulated: true },
      { lng: -1.6040, lat: 54.9760, name: 'SIM_E', simulated: true },
      { lng: -1.6170, lat: 54.9800, name: 'SIM_F', simulated: true },
      { lng: -1.6080, lat: 54.9755, name: 'SIM_G', simulated: true },
      { lng: -1.6155, lat: 54.9710, name: 'SIM_H', simulated: true },
    ];

    // Assign kriging predictions to all nodes
    sensorLocations.forEach((s, i) => {
      s.prediction = s.simulated
        ? 10 + rng() * 60
        : 20 + rng() * 100;
      s.confidence = s.simulated ? 0.4 + rng() * 0.3 : 0.7 + rng() * 0.25;
    });

    // ── Generate road segment GeoJSON ──
    function generateRoadSegments() {
      const features = [];
      const numSegments = 42;

      for (let i = 0; i < numSegments; i++) {
        const startLng = CENTER[0] + (rng() - 0.5) * 0.025;
        const startLat = CENTER[1] + (rng() - 0.5) * 0.015;
        const angle = rng() * Math.PI * 2;
        const length = 0.001 + rng() * 0.004;
        const numPoints = 2 + Math.floor(rng() * 3);
        const coords = [];

        for (let p = 0; p < numPoints; p++) {
          const t = p / (numPoints - 1);
          const jitter = (rng() - 0.5) * 0.0003;
          coords.push([
            startLng + Math.cos(angle + jitter * 10) * length * t,
            startLat + Math.sin(angle + jitter * 10) * length * t
          ]);
        }

        // Kriging prediction for this segment (interpolated from nearby sensors)
        let totalWeight = 0;
        let weightedPred = 0;
        for (const s of sensorLocations) {
          const dx = (startLng + Math.cos(angle) * length * 0.5) - s.lng;
          const dy = (startLat + Math.sin(angle) * length * 0.5) - s.lat;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const w = 1 / (dist + 0.001);
          totalWeight += w;
          weightedPred += w * s.prediction;
        }
        const segPred = weightedPred / totalWeight;

        const roadTypes = ['pedestrian', 'residential', 'primary', 'secondary', 'footway'];
        features.push({
          type: 'Feature',
          properties: {
            id: i,
            prediction: segPred,
            road_type: roadTypes[Math.floor(rng() * roadTypes.length)],
            directness: 0.5 + rng() * 0.5,
          },
          geometry: { type: 'LineString', coordinates: coords }
        });
      }

      return { type: 'FeatureCollection', features };
    }

    const roadSegments = generateRoadSegments();

    // ── Prediction color scale ──
    const predExtent = d3.extent([
      ...sensorLocations.map(s => s.prediction),
      ...roadSegments.features.map(f => f.properties.prediction)
    ]);

    const colorScale = d3.scaleSequential(d3.interpolateTurbo)
      .domain(predExtent);

    function predToRGB(val) {
      const hex = colorScale(val);
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return [r, g, b];
    }

    // ── Assign colors to road features ──
    roadSegments.features.forEach(f => {
      const [r, g, b] = predToRGB(f.properties.prediction);
      f.properties.color = `rgb(${r},${g},${b})`;
    });

    // ── Initialize MapLibre ──
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        name: 'Light Basemap',
        sources: {
          'osm-tiles': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap'
          }
        },
        layers: [{
          id: 'osm-tiles',
          type: 'raster',
          source: 'osm-tiles',
          paint: {
            'raster-saturation': -0.7,
            'raster-brightness-min': 0.3,
            'raster-opacity': 0.5
          }
        }],
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf'
      },
      center: CENTER,
      zoom: ZOOM,
      pitch: 0,
    });

    map.on('load', () => {
      // ── Road segments layer ──
      map.addSource('road-segments', {
        type: 'geojson',
        data: roadSegments
      });

      // Add one layer per road segment with its color
      // More efficient: use data-driven styling
      map.addLayer({
        id: 'road-segments-layer',
        type: 'line',
        source: 'road-segments',
        paint: {
          'line-color': ['get', 'color'],
          'line-width': 5,
          'line-opacity': 0.7,
        },
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
        }
      });

      // ── Sensor nodes ──
      const sensorGeoJSON = {
        type: 'FeatureCollection',
        features: sensorLocations.map(s => ({
          type: 'Feature',
          properties: {
            name: s.name,
            simulated: s.simulated,
            prediction: s.prediction,
            confidence: s.confidence,
          },
          geometry: { type: 'Point', coordinates: [s.lng, s.lat] }
        }))
      };

      map.addSource('sensors', { type: 'geojson', data: sensorGeoJSON });

      // Physical sensors — solid circles
      map.addLayer({
        id: 'sensors-physical',
        type: 'circle',
        source: 'sensors',
        filter: ['==', ['get', 'simulated'], false],
        paint: {
          'circle-radius': 8,
          'circle-color': '#F97316',
          'circle-stroke-color': '#FFFFFF',
          'circle-stroke-width': 2.5,
          'circle-opacity': 0.9,
        }
      });

      // Simulated sensors — outlined circles
      map.addLayer({
        id: 'sensors-simulated',
        type: 'circle',
        source: 'sensors',
        filter: ['==', ['get', 'simulated'], true],
        paint: {
          'circle-radius': 8,
          'circle-color': 'transparent',
          'circle-stroke-color': '#F97316',
          'circle-stroke-width': 2,
          'circle-opacity': 0.9,
        }
      });

      // Simulated — inner dot
      map.addLayer({
        id: 'sensors-simulated-inner',
        type: 'circle',
        source: 'sensors',
        filter: ['==', ['get', 'simulated'], true],
        paint: {
          'circle-radius': 3,
          'circle-color': '#F97316',
          'circle-opacity': 0.5,
        }
      });

      // Labels
      map.addLayer({
        id: 'sensor-labels',
        type: 'symbol',
        source: 'sensors',
        layout: {
          'text-field': ['get', 'name'],
          'text-size': 10,
          'text-offset': [0, 1.5],
          'text-anchor': 'top',
          'text-font': ['Open Sans Regular'],
        },
        paint: {
          'text-color': '#525252',
          'text-halo-color': '#FFFFFF',
          'text-halo-width': 1.5,
        }
      });

      // ── Popups ──
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });

      ['sensors-physical', 'sensors-simulated', 'sensors-simulated-inner'].forEach(layerId => {
        map.on('mouseenter', layerId, (e) => {
          map.getCanvas().style.cursor = 'pointer';
          const f = e.features[0];
          const p = f.properties;
          popup.setLngLat(f.geometry.coordinates)
            .setHTML(`
              <div class="node-popup">
                <strong>${p.name}</strong> ${p.simulated === true || p.simulated === 'true' ? '(simulated)' : ''}<br/>
                <span class="mono">μ: ${Number(p.prediction).toFixed(1)} · conf: ${Number(p.confidence).toFixed(2)}</span>
              </div>
            `)
            .addTo(map);
        });

        map.on('mouseleave', layerId, () => {
          map.getCanvas().style.cursor = '';
          popup.remove();
        });
      });
    });
  </script>
</body>
</html>
