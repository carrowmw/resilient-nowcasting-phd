<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experiment 3 design: 103 runs along a pre-declared base chain</title>
<link rel="stylesheet" href="lib/fig.css">
<script src="../vendor/d3.min.js"></script>
<script src="lib/fig.js"></script>
<script src="data/v5_runs.js"></script>
</head>
<body>
<svg id="chart" role="img" aria-label="Every Experiment 3 run as a dot, grouped by phase, above the chain of base models from V4R to V5F"></svg>
<script>
const { C } = Fig;
const { w: W, h: H } = Fig.size();
const runs = window.DATA_V5_RUNS.runs;

const PHASES = [
  { g: "thesis_v4", label: "V4 re-run", q: "Do the ablations hold?", base: "v4r_full" },
  { g: "p1_hygiene", label: "P1 Loss hygiene", q: "Stop scoring gaps as zero", base: "e1_6_complete_weather" },
  { g: "p2_masking", label: "P2 Masking", q: "Make training gaps look real", base: "e2_7_mixed_030" },
  { g: "p3_inputs", label: "P3 Inputs", q: "Which covariates help?", base: "e3_stack" },
  { g: "p4_likelihood", label: "P4 Likelihood", q: "Model outages explicitly?", base: "e4_4_anchored" },
  { g: "p5_magnitude", label: "P5 Peaks", q: "Fix under-prediction?", base: null },
  { g: "p6_mtl", label: "P6 Multi-task", q: "Do the heads conflict?", base: null },
  { g: "p7_v5_suite", label: "V5 suite", q: "Ablate the final model", base: "v5_full" },
  { g: "loo", label: "Leave-one-out", q: "What does V5F need?", base: null },
];
const CHAIN = [
  { k: "v4r_full", name: "V4R", sub: "thesis model", from: 0, to: 0 },
  { k: "e1_6_complete_weather", name: "P2B", sub: "+ hygiene", from: 1, to: 1 },
  { k: "e2_7_mixed_030", name: "P3B", sub: "+ unified encoding", from: 2, to: 2 },
  { k: "e3_stack", name: "P4B", sub: "+ covariates", from: 3, to: 3 },
  { k: "e4_4_anchored", name: "P5B", sub: "+ outage head", from: 4, to: 4 },
  { k: "v5_full", name: "V5F", sub: "+ peaks, quantiles, fixes", from: 5, to: 8 },
];

const M = { l: 10, r: 10, t: 20 };
const svg = d3.select("#chart").attr("width", W).attr("height", H);
const x = d3.scaleBand().domain(d3.range(PHASES.length)).range([M.l, W - M.r]).paddingInner(0.12);
const cols = 3, r = 11, cell = 30;

PHASES.forEach((p, i) => {
  const members = runs.filter((d) => d.group === p.g).sort((a, b) => (a.experiment === p.base ? -1 : b.experiment === p.base ? 1 : 0));
  const g = svg.append("g").attr("transform", `translate(${x(i)},${M.t})`);
  g.append("text").attr("class", "annot-strong").attr("x", 0).attr("y", 20).text(p.label);
  g.append("text").attr("class", "annot").attr("x", 0).attr("y", 46).text(`${members.length} runs`);
  const qy = 80;
  // Wrap the question to the column width.
  const words = p.q.split(" ");
  let line = "", ly = qy;
  const qt = g.append("text").attr("class", "annot").attr("font-style", "italic");
  words.forEach((w) => {
    const test = line ? line + " " + w : w;
    if (test.length * 9.2 > x.bandwidth() && line) {
      qt.append("tspan").attr("x", 0).attr("y", ly).text(line); line = w; ly += 22;
    } else line = test;
  });
  qt.append("tspan").attr("x", 0).attr("y", ly).text(line);

  const dotsY = ly + 34;
  g.selectAll("circle").data(members).join("circle")
    .attr("cx", (d, j) => r + (j % cols) * cell).attr("cy", (d, j) => dotsY + Math.floor(j / cols) * cell)
    .attr("r", r).attr("fill", (d) => (d.experiment === p.base ? C.blue : d.experiment.startsWith("naive") ? C.text2 : C.rule))
    .attr("stroke", "#fff").attr("stroke-width", 2)
    .on("pointermove", (ev, d) => Fig.showTip(ev, d.experiment, [
      { value: d.desc.slice(0, 70), name: "" },
      { value: d.test_obs_all_rmse == null ? "–" : d.test_obs_all_rmse.toFixed(1), name: "all-sensor RMSE" },
      { value: d.duration_h == null ? "–" : d.duration_h.toFixed(1) + " h", name: "GPU time" },
    ]))
    .on("pointerleave", Fig.hideTip);
});

// The base chain underneath.
const cy = H - 140;
svg.append("line").attr("x1", x(0)).attr("x2", x(PHASES.length - 1) + x.bandwidth()).attr("y1", cy + 40).attr("y2", cy + 40).attr("stroke", C.rule).attr("stroke-width", 2);
CHAIN.forEach((c, i) => {
  const x0 = x(c.from), x1 = x(c.to) + x.bandwidth();
  const g = svg.append("g").attr("class", "step").attr("data-step", 1);
  g.append("rect").attr("x", x0).attr("y", cy).attr("width", x1 - x0).attr("height", 80)
    .attr("fill", c.k === "v5_full" ? C.blue : c.k === "v4r_full" ? C.orange : "#fff")
    .attr("stroke", c.k === "v5_full" ? C.blue : c.k === "v4r_full" ? C.orange : C.text).attr("stroke-width", 2);
  g.append("text").attr("x", x0 + 14).attr("y", cy + 34).attr("font-size", 24).attr("font-weight", 700)
    .style("fill", c.k === "v5_full" || c.k === "v4r_full" ? "#fff" : C.text).text(c.name);
  g.append("text").attr("x", x0 + 14).attr("y", cy + 62).attr("font-size", 16)
    .style("fill", c.k === "v5_full" || c.k === "v4r_full" ? "#fff" : C.text2).text(c.sub);
});
svg.append("text").attr("class", "annot step").attr("data-step", 1).attr("x", x(0)).attr("y", cy + 116)
  .text("Pre-declared base chain: each phase screens one factor at a time against the previous base (blue) · dark grey = non-learned baselines");

Fig.onStep((s) => Fig.showSteps(document.body, s), 1);
</script>
</body>
</html>
