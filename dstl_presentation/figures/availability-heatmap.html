<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekly data availability for the 81 Newcastle pedestrian stations</title>
<link rel="stylesheet" href="lib/fig.css">
<script src="../vendor/d3.min.js"></script>
<script src="lib/fig.js"></script>
<script src="data/availability.js"></script>
<style>
  #top { position: absolute; left: 0; top: 0; right: 0; display: flex; gap: 40px; align-items: center; }
  .ramp { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--text-2); }
  .ramp canvas { width: 220px; height: 14px; }
</style>
</head>
<body>
<div id="top">
  <div class="ramp"><span>Share of 15-min slots reported per week</span><span>0%</span><canvas id="ramp" width="220" height="14"></canvas><span>100%</span></div>
  <div id="legend"></div>
</div>
<svg id="chart" role="img" aria-label="Heat map of weekly completeness, one row per station, January 2023 to June 2026"></svg>
<script>
const { C } = Fig;
const D = window.DATA_AVAILABILITY;
const { w: W, h: H } = Fig.size();
// The archive starts in January 2023 but the network only reports from mid-2023: trim the empty lead-in.
const first = d3.min(D.stations, (s) => s.weeks.findIndex((v) => v > 0));
const weeks = D.weekStarts.slice(first).map((s) => new Date(s + "T00:00:00Z"));
const st = D.stations.map((s) => ({ ...s, weeks: s.weeks.slice(first) }));

// Sequential: one hue (GOV.UK blue family), light to dark. Zero is the bare surface.
const color = d3.scaleLinear().domain([0.001, 1]).range(["#d2e2f1", "#003078"]).interpolate(d3.interpolateLab);
const cv = document.getElementById("ramp").getContext("2d");
for (let i = 0; i < 220; i++) { cv.fillStyle = color(Math.max(0.001, i / 219)); cv.fillRect(i, 0, 1, 14); }
Fig.legend(document.getElementById("legend"), [{ label: "Held-out station (never trained on)", color: C.orange, shape: "rect" }]);

const M = { l: 40, r: 20, t: 84, b: 50 };
const svg = d3.select("#chart").attr("width", W).attr("height", H);
const x = d3.scaleBand().domain(d3.range(weeks.length)).range([M.l, W - M.r]).paddingInner(0);
const y = d3.scaleBand().domain(d3.range(st.length)).range([M.t, H - M.b]).paddingInner(0.12);

const cells = [];
st.forEach((s, i) => s.weeks.forEach((v, j) => { if (v > 0) cells.push({ i, j, v }); }));
svg.append("g").selectAll("rect").data(cells).join("rect")
  .attr("x", (d) => x(d.j)).attr("y", (d) => y(d.i)).attr("width", x.bandwidth() + 0.3).attr("height", y.bandwidth())
  .attr("fill", (d) => color(d.v));

// Held-out markers at the left edge.
svg.append("g").selectAll("rect").data(st.map((s, i) => ({ s, i })).filter((d) => d.s.role === "holdout")).join("rect")
  .attr("x", M.l - 22).attr("y", (d) => y(d.i)).attr("width", 12).attr("height", y.bandwidth()).attr("fill", C.orange);

const years = d3.utcYear.range(d3.utcYear.ceil(weeks[0]), weeks[weeks.length - 1]);
const xOf = (date) => M.l + ((date - weeks[0]) / (7 * 864e5)) * x.step();
svg.append("g").selectAll("g").data(years).join("g").call((g) => {
  g.append("line").attr("x1", xOf).attr("x2", xOf).attr("y1", M.t - 8).attr("y2", H - M.b + 6).attr("stroke", "#fff").attr("stroke-width", 2);
  g.append("text").attr("class", "annot").attr("x", (d) => xOf(d) + 6).attr("y", H - M.b + 28).text((d) => d.getUTCFullYear());
});
svg.append("text").attr("class", "annot").attr("x", M.l).attr("y", M.t - 16)
  .text(`${st.length} stations, sorted by completeness · each column is one week, ${d3.utcFormat("%b %Y")(weeks[0])} – Jun 2026`);

// Hover: row + column readout.
const hl = svg.append("rect").attr("fill", "none").attr("stroke", C.text).attr("stroke-width", 1.5).attr("opacity", 0);
svg.append("rect").attr("x", M.l).attr("y", M.t).attr("width", W - M.l - M.r).attr("height", H - M.t - M.b).attr("fill", "transparent")
  .on("pointermove", (ev) => {
    const [mx, my] = d3.pointer(ev);
    const j = Math.min(weeks.length - 1, Math.max(0, Math.floor((mx - M.l) / x.step())));
    const i = Math.min(st.length - 1, Math.max(0, Math.floor((my - M.t) / y.step())));
    const s = st[i];
    hl.attr("x", M.l).attr("y", y(i) - 1).attr("width", W - M.l - M.r).attr("height", y.bandwidth() + 2).attr("opacity", 1);
    Fig.showTip(ev, s.name.replace(/^Ncl/, ""), [
      { value: d3.format(".0%")(s.weeks[j]), name: `week of ${d3.utcFormat("%-d %b %Y")(weeks[j])}` },
      { value: d3.format(".0%")(s.completeness), name: "whole period" },
      { value: s.role === "holdout" ? "held out" : "training", name: "role in Experiment 3" },
    ]);
  })
  .on("pointerleave", () => { hl.attr("opacity", 0); Fig.hideTip(); });

Fig.onStep(() => {}, 0);
</script>
</body>
</html>
