<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thesis Experiment 3 ablations: published vs re-run</title>
<link rel="stylesheet" href="lib/fig.css">
<script src="../vendor/d3.min.js"></script>
<script src="lib/fig.js"></script>
<script src="data/v5_runs.js"></script>
<style>#legend { position: absolute; left: 0; top: 0; right: 0; }</style>
</head>
<body>
<div id="legend"></div>
<svg id="chart" role="img" aria-label="Change in forecast RMSE for seven ablations: as published in the thesis draft, re-run with observed-only scoring, and on RIoT v5"></svg>
<script>
const { C } = Fig;
const runs = Fig.runsByExperiment();
const { w: W, h: H } = Fig.size();

// Thesis column: the deltas published in the Chapter 7 draft (legacy metric).
// Source: docs/experiments/riot_v5/riot_v5_results_report.md §7.1.
const ROWS = [
  { label: "No imputation loss", thesis: 0.076, v4: "v4r_no_impute", v5: "v5_no_impute" },
  { label: "No kriging loss", thesis: 0.032, v4: "v4r_no_kriging", v5: "v5_no_kriging" },
  { label: "No mask channels", thesis: 0.096, v4: "v4r_no_masks", v5: "v5_no_masks" },
  { label: "No positional encoding", thesis: 0.045, v4: "v4r_no_pe", v5: "v5_no_pe" },
  { label: "LSTM instead of graph", thesis: 0.224, v4: "v4r_lstm", v5: "v5_lstm" },
  { label: "Batch size 32", thesis: -0.073, v4: "v4r_bs32", v5: "v5_bs32" },
  { label: "Dropout 0.3", thesis: 0.075, v4: "v4r_dropout03", v5: "v5_dropout03" },
];
const k = "test_obs_all_rmse";
for (const r of ROWS) {
  r.rerun = runs[r.v4][k] / runs.v4r_full[k] - 1;
  r.onV5 = runs[r.v5][k] / runs.v5_full[k] - 1;
}

const SER = [
  { key: "thesis", label: "Thesis draft (legacy metric, zero-filled gaps)", color: C.text2, hollow: true, step: 0 },
  { key: "rerun", label: "Same model re-run, scored on observed data only", color: C.orange, step: 1 },
  { key: "onV5", label: "Same ablation on RIoT v5", color: C.blue, step: 2 },
];
Fig.legend(document.getElementById("legend"), SER.map((s) => ({ label: s.label, color: s.color, shape: "dot" })))
  .querySelectorAll(".item").forEach((el, i) => {
    el.classList.add("step"); el.dataset.step = SER[i].step;
    if (SER[i].hollow) Object.assign(el.firstChild.style, { background: "#fff", border: `3px solid ${SER[i].color}` });
  });

const M = { l: 330, r: 80, t: 80, b: 70 };
const svg = d3.select("#chart").attr("width", W).attr("height", H);
const x = d3.scaleLinear().domain([-0.1, 0.25]).range([M.l, W - M.r]);
const y = d3.scaleBand().domain(ROWS.map((r) => r.label)).range([M.t, H - M.b]).padding(0.3);

svg.append("rect").attr("x", x(-0.03)).attr("width", x(0.03) - x(-0.03)).attr("y", M.t - 16).attr("height", H - M.b - M.t + 16).attr("fill", C.panel);
svg.append("text").attr("class", "annot").attr("x", x(0)).attr("y", M.t - 24).attr("text-anchor", "middle").text("noise ±3%");
svg.append("g").attr("class", "grid").attr("transform", `translate(0,${H - M.b})`)
  .call(d3.axisBottom(x).ticks(7).tickFormat((v) => Fig.fmt.pct(v)).tickSize(-(H - M.b - M.t + 16)))
  .call((a) => a.select(".domain").remove()).call((a) => a.selectAll(".tick text").attr("dy", 14));
svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", M.t - 16).attr("y2", H - M.b).attr("stroke", C.text2);
svg.append("text").attr("class", "axis-label").attr("x", (M.l + W - M.r) / 2).attr("y", H - 16).attr("text-anchor", "middle")
  .text("Change in forecast RMSE vs the full model  ·  right = the ablation hurts, left = it helps");
svg.append("text").attr("class", "annot").attr("x", W - M.r).attr("y", M.t - 24).attr("text-anchor", "end").text("ablation hurts →");
svg.append("text").attr("class", "annot").attr("x", M.l).attr("y", M.t - 24).text("← ablation helps");

const row = svg.selectAll("g.row").data(ROWS).join("g").attr("class", "row")
  .attr("transform", (r) => `translate(0,${y(r.label) + y.bandwidth() / 2})`);
row.append("text").attr("class", "label").attr("x", M.l - 24).attr("y", 6).attr("text-anchor", "end").text((r) => r.label);
// Connector from published to re-run value: the size of the measurement artefact.
row.append("line").attr("class", "step").attr("data-step", 1)
  .attr("x1", (r) => x(r.thesis)).attr("x2", (r) => x(r.rerun)).attr("stroke", C.rule).attr("stroke-width", 3);
for (const s of SER) {
  const g = row.append("g").attr("class", "step").attr("data-step", s.step);
  g.append("circle").attr("cx", (r) => x(r[s.key])).attr("r", 9)
    .attr("fill", s.hollow ? "#fff" : s.color).attr("stroke", s.hollow ? s.color : "#fff").attr("stroke-width", s.hollow ? 3 : 2);
}
// Label the two sign reversals.
const flips = ROWS.filter((r) => Math.sign(r.thesis) !== Math.sign(r.rerun) && Math.abs(r.rerun) > 0.03);
row.filter((r) => flips.includes(r)).append("text").attr("class", "annot-strong step").attr("data-step", 1)
  .attr("x", (r) => Math.max(x(r.thesis), x(r.rerun)) + 22).attr("y", 6)
  .text("sign reverses");

row.append("rect").attr("x", M.l - 300).attr("y", -y.step() / 2).attr("width", W - M.l - M.r + 300).attr("height", y.step())
  .attr("fill", "transparent")
  .on("pointermove", (ev, r) => Fig.showTip(ev, r.label, SER
    .filter((s) => !document.querySelector(`.legend .item:nth-child(${SER.indexOf(s) + 1})`).classList.contains("step-hidden"))
    .map((s) => ({ color: s.color, value: Fig.fmt.pct(r[s.key], 1), name: s.label.split(" (")[0] }))))
  .on("pointerleave", Fig.hideTip);

Fig.onStep((s) => Fig.showSteps(document.body, s), 2);
</script>
</body>
</html>
