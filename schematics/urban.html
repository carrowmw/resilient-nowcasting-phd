<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline schematic: urban science audience</title>
<style>html,body{margin:0;background:#fff}svg{display:block}</style>

<script src="src/schematic.js"></script>
</head>
<body>
<svg id="schematic" role="img" aria-label="Schematic: patchy city sensor data feed a resilient model that produces a complete city picture with uncertainty"></svg>
<script>
window.SCHEMATIC_CONTENT = {
  title: "RIoT (Resilient Internet of Things) Framework",
  subtitle: "What this research sets out to do: turn patchy urban sensor data into a complete, honest picture of how people move through the city, now and in the near future.",
  stages: [
    { title: "Real city data", lede: "Footfall counters go offline, report patchily and cover only some streets." },
    { title: "Resilient model", lede: "One model learns from the data as is, without the need for gap-filling or clean-up." },
    { title: "City digital twin", lede: "Every street gets an estimate, each with an honest measure of certainty." },
  ],
  mapCaption: "Newcastle pedestrian counters (simplified)",
  pictureCaption: "Smaller halo = more certain",
  failures: [
    { symbol: "intermittent", title: "Patchy reporting", text: "Data arrive in short, broken runs rather than a steady stream." },
    { symbol: "silent", title: "Quiet street, or fault?", text: "Counters send nothing when no one passes, and nothing when they break." },
    { symbol: "lost", title: "Long outages", text: "Power, network or maintenance failures, sometimes lasting months." },
    { symbol: "unsensed", title: "Unmeasured streets", text: "Most streets have no counter at all." },
  ],
  engine: {
    title: "A model built for patchy data",
    lede: "Designed on the assumption that city data will be incomplete, rather than treating gaps as an exception.",
    principles: [
      { title: "Learns from the gaps", text: "Uses when and where data go missing as information, instead of filling them in first." },
      { title: "Learns from nearby streets", text: "Combines neighbouring counters with street layout, local shops and transport, the calendar and weather." },
      { title: "Knows how sure it is", text: "Gives a range with every estimate, wider wherever direct evidence is thin." },
    ],
    footnote: "Trained by deliberately hiding data",
  },
  outputs: [
    { symbol: "filled", title: "Footfall at offline counters", text: "What a counter would be recording now, had it kept working." },
    { symbol: "between", title: "Estimates for unmeasured streets", text: "A citywide picture, not just a set of sensor points." },
    { symbol: "forecast", title: "Short-term forecasts", text: "Expected footfall for the coming period, with a likely range." },
    { symbol: "alert", title: "Data-quality flags", text: "Highlights where an estimate rests on little direct data." },
  ],
  degradation: {
    title: "Graceful degradation",
    xLabel: "Data quality: good → poor",
    yLabel: "Usefulness of the output",
    brittle: "Conventional approach: works on complete data, then breaks down, or quietly reports empty streets.",
    resilient: "Aim of this approach: keeps producing estimates through outages, with wider ranges and a clear flag.",
  },
  audience: {
    title: "Who could use it",
    chips: ["City planners", "Transport operators", "Events and crowd safety", "Urban researchers"],
    text: "A dependable picture of footfall supports planning, operations and research, even when parts of the sensor network are down.",
  },
  footer: "Data: Newcastle Urban Observatory pedestrian counting network, 2023–2026. Newcastle University PhD research. Funded by DSTL as part of the Geospatial Systems CDT",
};
drawSchematic();
</script>

</html>
