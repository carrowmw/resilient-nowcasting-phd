<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Kriging Map</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FFFFFF;
      font-family: 'Inter', system-ui, sans-serif;
      color: #171717;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 60px;
      overflow: hidden;
    }

    .figure-container {
      width: 100%;
      max-width: 1600px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .figure-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 2px solid #E5E5E7;
      background: #FFFFFF;
      z-index: 10;
      flex-shrink: 0;
    }

    .figure-title { font-size: 28px; font-weight: 700; color: #171717; }
    .figure-title .accent { color: #F97316; }

    .figure-subtitle {
      font-size: 16px;
      color: #A3A3A3;
      font-weight: 400;
      margin-top: 6px;
    }

    .legend-bar { display: flex; align-items: center; gap: 16px; }

    .gradient-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #525252;
    }

    .gradient-bar {
      width: 120px;
      height: 12px;
      border-radius: 3px;
    }

    .legend-dots { display: flex; gap: 12px; font-size: 11px; color: #525252; }

    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block; vertical-align: middle; margin-right: 4px;
    }

    .legend-dot-sim {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block; vertical-align: middle; margin-right: 4px;
      border: 2px dashed #F97316; background: transparent;
    }

    #map {
      flex: 1;
      min-height: 0;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #E5E5E7;
    }
    .maplibregl-ctrl-attrib { display: none !important; }
    .maplibregl-canvas { outline: none !important; }

    .node-popup { font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; }
    .node-popup strong { color: #F97316; }
    .node-popup .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }

    .stats-overlay {
      position: absolute;
      bottom: 30px;
      left: 30px;
      display: flex;
      gap: 12px;
      z-index: 5;
    }

    .stat-pill {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #E5E5E7;
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat-pill .value {
      font-size: 18px;
      font-weight: 800;
      color: #F97316;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-pill .label {
      font-size: 9px;
      color: #A3A3A3;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="figure-container">
    <div class="figure-header">
      <div>
        <div class="figure-title">
          <span class="accent">Spatial Kriging</span> Reconstruction
        </div>
        <div class="figure-subtitle">
          Kriging-decoder predictions across the sensor network · real + simulated nodes
        </div>
      </div>
      <div class="legend-bar">
        <div class="gradient-legend">
          <span>Low</span>
          <div class="gradient-bar" id="gradient-bar"></div>
          <span>High</span>
          <span style="margin-left: 4px; color: #A3A3A3;">Predicted count</span>
        </div>
        <div class="legend-dots">
          <span><span class="legend-dot" style="background: #F97316;"></span>Physical sensor</span>
          <span><span class="legend-dot-sim"></span>Simulated node</span>
        </div>
      </div>
    </div>

    <div id="map"></div>

    <div class="stats-overlay">
    <div class="stat-pill">
      <div class="value" id="stat-real">–</div>
      <div class="label">Physical sensors</div>
    </div>
    <div class="stat-pill">
      <div class="value" id="stat-sim">–</div>
      <div class="label">Simulated nodes</div>
    </div>
    <div class="stat-pill">
      <div class="value" id="stat-mae">–</div>
      <div class="label">Val MAE</div>
    </div>
  </div><!-- /.figure-container -->

  <script>
    // Real kriging snapshot, cached from the R2 payload bucket (default run).
    // Regenerate with: presentation/scripts/build_figure_data.py
    d3.json('data/kriging.json').then(init);

    function init(data) {
      const nodes = data.nodes;
      const byId = new Map(nodes.map(n => [n.id, n]));

      // ── Prediction colour scale ──
      const predExtent = d3.extent(nodes, n => n.mu);
      const colorScale = d3.scaleSequential(d3.interpolateTurbo).domain(predExtent);
      // Paint the legend gradient to match the scale
      const stops = d3.range(0, 1.001, 0.05)
        .map(t => colorScale(predExtent[0] + t * (predExtent[1] - predExtent[0])))
        .join(',');
      document.getElementById('gradient-bar').style.background =
        `linear-gradient(to right, ${stops})`;

      // ── Stats ──
      document.getElementById('stat-real').textContent = data.meta.num_real;
      document.getElementById('stat-sim').textContent = data.meta.num_sim;
      document.getElementById('stat-mae').textContent =
        data.meta.val_mae != null ? data.meta.val_mae.toFixed(2) : '–';

      // ── Fit map to node bounds ──
      const lons = nodes.map(n => n.lon);
      const lats = nodes.map(n => n.lat);
      const bounds = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          name: 'Light Basemap',
          sources: {
            'osm-tiles': {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: '© OpenStreetMap'
            }
          },
          layers: [{
            id: 'osm-tiles',
            type: 'raster',
            source: 'osm-tiles',
            paint: {
              'raster-saturation': -0.7,
              'raster-brightness-min': 0.3,
              'raster-opacity': 0.5
            }
          }],
          glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf'
        },
        bounds: bounds,
        fitBoundsOptions: { padding: 70 },
      });

      map.on('load', () => {
        // ── Kriging context edges: simulated nodes → graph neighbours ──
        const edgeFeatures = data.kriging_edges.map(e => {
          const a = byId.get(e.s), b = byId.get(e.t);
          return {
            type: 'Feature',
            properties: { w: e.w },
            geometry: { type: 'LineString', coordinates: [[a.lon, a.lat], [b.lon, b.lat]] }
          };
        });
        map.addSource('kriging-edges', { type: 'geojson', data: { type: 'FeatureCollection', features: edgeFeatures } });
        map.addLayer({
          id: 'kriging-edges-layer',
          type: 'line',
          source: 'kriging-edges',
          paint: {
            'line-color': '#F97316',
            'line-width': ['interpolate', ['linear'], ['get', 'w'], 0, 1, 0.35, 4],
            'line-opacity': 0.55,
            'line-dasharray': [2, 1.5],
          },
          layout: { 'line-cap': 'round' }
        });

        // ── Sensor nodes ──
        const sensorGeoJSON = {
          type: 'FeatureCollection',
          features: nodes.map(n => ({
            type: 'Feature',
            properties: {
              name: n.name,
              simulated: n.sim,
              mu: n.mu,
              sigma: n.sigma,
              color: colorScale(n.mu),
            },
            geometry: { type: 'Point', coordinates: [n.lon, n.lat] }
          }))
        };
        map.addSource('sensors', { type: 'geojson', data: sensorGeoJSON });

        // Physical sensors — solid, colour-coded by predicted count
        map.addLayer({
          id: 'sensors-physical',
          type: 'circle',
          source: 'sensors',
          filter: ['==', ['get', 'simulated'], false],
          paint: {
            'circle-radius': 7,
            'circle-color': ['get', 'color'],
            'circle-stroke-color': '#FFFFFF',
            'circle-stroke-width': 2,
            'circle-opacity': 0.92,
          }
        });

        // Simulated nodes — colour-coded fill with a dashed orange ring
        map.addLayer({
          id: 'sensors-simulated',
          type: 'circle',
          source: 'sensors',
          filter: ['==', ['get', 'simulated'], true],
          paint: {
            'circle-radius': 9,
            'circle-color': ['get', 'color'],
            'circle-stroke-color': '#F97316',
            'circle-stroke-width': 2.5,
            'circle-opacity': 0.95,
          }
        });

        // ── Popups ──
        const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
        ['sensors-physical', 'sensors-simulated'].forEach(layerId => {
          map.on('mouseenter', layerId, (e) => {
            map.getCanvas().style.cursor = 'pointer';
            const f = e.features[0];
            const p = f.properties;
            const sim = p.simulated === true || p.simulated === 'true';
            popup.setLngLat(f.geometry.coordinates)
              .setHTML(`
                <div class="node-popup">
                  <strong>${p.name}</strong> ${sim ? '(simulated)' : ''}<br/>
                  <span class="mono">μ: ${Number(p.mu).toFixed(1)} · σ: ${Number(p.sigma).toFixed(1)}</span>
                </div>
              `)
              .addTo(map);
          });
          map.on('mouseleave', layerId, () => {
            map.getCanvas().style.cursor = '';
            popup.remove();
          });
        });
      });
    }
  </script>
</body>
</html>
