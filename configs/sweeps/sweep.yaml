wandb:
  project: "resilient-iot-v3"
  sweep_project: "resilient-iot-sweeps-v3"
  collection: "resilient-iot-model-sweep"

parameters:
  lr:
    distribution: log_uniform_values
    min: 1.0e-05
    max: 1.0e-02
  w_forecast:
    distribution: uniform
    min: 0.5
    max: 5.0
  w_impute:
    distribution: uniform
    min: 0.5
    max: 5.0
  sparsity_threshold:
    distribution: uniform
    min: 0.1
    max: 0.9
  mask_prob:
    distribution: uniform
    min: 0.05
    max: 0.3
  num_layers:
    values: [1, 2, 4, 6]
  embedding_dim:
    values: [16, 32, 64]
  hidden_dim:
    values: [32, 64, 128]
  batch_size:
    values: [64, 128, 256]
