data_source: "database"  # "database" | "parquet"
holdout_start: 2026-05-01
holdout_end: 2026-06-01
veh_class: "person"
dir: "all"
seq_len: 12

export:
  # Number of 15-min timesteps to include per exported day (96 = 24h × 4/h).
  num_timesteps_target: 96
  # Top-K ego-graph edges stored per node in the UI payload.
  top_k_ego_edges: 10
  # Newcastle bounding box (WGS-84) used to validate/place simulated nodes.
  ncl_lat_min: 54.968
  ncl_lat_max: 55.012
  ncl_lon_min: -1.660
  ncl_lon_max: -1.576
  # Five deterministic simulated node positions within the bounding box.
  simulated_node_coords:
    - [54.978, -1.595]
    - [55.005, -1.580]
    - [54.977851, -1.612579]
    - [54.976248, -1.610691]
    - [54.973199, -1.611128]
  # Artificial masking probability used when exporting (matches training default).
  mask_prob: 0.15
