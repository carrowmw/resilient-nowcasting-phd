use_database: true

wandb:
  project: "resilient-iot-v2-test"
  sweep_project: "resilient-iot-sweeps-v2-test"
  collection: "resilient-iot-model-v2-test"

data:
  start_date: "2024-04-02"
  end_date: "2024-04-03" # Small date range for quick smoke test
  seq_len: 12
  target_veh_class: "person"
  target_dir: "all"
  mask_prob: 0.15
  # PHASE 2: spatial kriging holdout (20% of nodes, aligned with prod) — exercises the live kriging path.
  spatial_holdout_prob: 0.2

model:
  num_nodes: 81
  static_feat_dim: 15
  time_series_dim: 3
  embedding_dim: 16
  hidden_dim: 32
  sparsity_threshold: 0.5
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  dim_feedforward: null # defaults to hidden_dim * 4
  zinb_eps: 1.0e-6
  # PHASE 3: physical edge features (9 physical + 1 learned -> GATv2 edge_dim=10).
  edge_features_cache_path: "data/external/edge_features_cache.json"

training:
  epochs: 1 # Only 1 epoch for quick verification
  batch_size: 32
  lr: 0.0003
  grad_clip_max_norm: 1.0
  random_seed: 42
  early_stop_patience: 10
  early_stop_min_delta: 0.001

loss:
  w_forecast: 1.0
  w_impute: 1.0
  # PHASE 2: active kriging loss weight.
  w_kriging: 0.5
