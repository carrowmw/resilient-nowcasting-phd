# ============================================================================
# Ablation D: New Architecture + Small Batch Size
# ============================================================================
# PURPOSE: Isolate the effect of batch size on spatial generalization.
#
# Uses the new large architecture (h=64, L=3, e=32) but restores the old
# batch size (32). If spatial interpolation improves, the 4× batch size
# increase is a key contributor to the regression (sharper minima hypothesis).
#
# CONTROL: train_riot_full_inductive.yaml (bs=128)
# VARIABLE: batch_size (reduced from 128 to 32)
# ============================================================================

wandb:
  project: "resilient-iot-v3"
  sweep_project: "resilient-iot-sweeps-v3"
  collection: "ablation-spatial-int"

data:
  start_date: "2023-04-02"
  end_date: "2026-04-02"
  seq_len: 12
  target_veh_class: "person"
  target_dir: "all"
  mask_prob: 0.15
  spatial_holdout_prob: 0.2
  inductive_holdout_frac: 0.2

model:
  num_nodes: 81
  static_feat_dim: 15
  time_series_dim: 3
  # === NEW ARCHITECTURE (same as crisp-puddle-47) ===
  embedding_dim: 32
  hidden_dim: 64
  num_layers: 3
  # ==================================================
  num_heads: 4
  sparsity_threshold: 0.5
  dropout: 0.1
  dim_feedforward: null
  zinb_eps: 1.0e-6

training:
  epochs: 100
  # === OLD BATCH SIZE ===
  batch_size: 32
  # ======================
  lr: 0.0003
  grad_clip_max_norm: 1.0
  early_stop_patience: 10
  early_stop_min_delta: 0.001

loss:
  w_forecast: 1.0
  w_impute: 1.0
  w_kriging: 0.5

model_type: gnn
eval_mode: inductive
train_split: 0.8
amp: false
