# ============================================================================
# Ablation C: Old Architecture + New Pipeline
# ============================================================================
# PURPOSE: Isolate the effect of model capacity on spatial interpolation.
#
# Uses the dark-brook-37 architecture (h=32, L=2, e=16, bs=32) but with
# the new data pipeline settings (3-year range, inductive holdout, database).
# If this recovers spatial interpolation quality, the regression is caused
# by the capacity increase, not the data/eval changes.
#
# CONTROL: train_riot_full_inductive.yaml (h=64, L=3, e=32, bs=128)
# VARIABLE: model capacity (reduced to dark-brook-37 levels)
# ============================================================================

wandb:
  project: "resilient-iot-v2"
  sweep_project: "resilient-iot-sweeps-v2"
  collection: "ablation-old-arch-inductive"

data:
  # Full 3-year range (same as crisp-puddle-47 / radiant-voice-41)
  start_date: "2023-04-02"
  end_date: "2026-04-02"
  seq_len: 12
  target_veh_class: "person"
  target_dir: "all"
  mask_prob: 0.15
  # Same inductive setup as the newer models
  spatial_holdout_prob: 0.2
  inductive_holdout_frac: 0.2

model:
  num_nodes: 81
  static_feat_dim: 15
  time_series_dim: 3
  # === OLD ARCHITECTURE (dark-brook-37) ===
  embedding_dim: 16
  hidden_dim: 32
  num_layers: 2
  # ========================================
  num_heads: 4
  sparsity_threshold: 0.5
  dropout: 0.1
  dim_feedforward: null
  zinb_eps: 1.0e-6

training:
  epochs: 100
  # === OLD BATCH SIZE ===
  batch_size: 32
  # ======================
  lr: 0.0003
  grad_clip_max_norm: 1.0
  early_stop_patience: 10
  early_stop_min_delta: 0.001

loss:
  w_forecast: 1.0
  w_impute: 1.0
  w_kriging: 0.5

model_type: gnn
eval_mode: inductive
train_split: 0.8
amp: false
