# ============================================================================
# Ablation A1: Large Architecture + New Data (Zero-Free)
# ============================================================================
# PURPOSE: Isolate the data change from the architecture change.
#
# Uses the floral-rain-6 architecture (h=64, L=3, e=32, bs=128, d=0.1)
# on the new (zero-free) dataset. floral-rain-6 used this architecture
# on OLD data (with night-time zeros) and had excellent spatial interpolation.
# If A1 collapses → the data change (zero removal) is the culprit.
# If A1 succeeds → architecture changes in radiant-dawn-8 caused the collapse.
#
# CONTROL: floral-rain-6 (same arch, old data with zeros)
# VARIABLE: data pipeline (zeros removed)
# ============================================================================

wandb:
  project: "resilient-iot-v3"
  sweep_project: "resilient-iot-sweeps-v3"
  collection: "ablation-spatial-int"

data:
  start_date: "2023-04-02"
  end_date: "2026-04-02"
  seq_len: 12
  target_veh_class: "person"
  target_dir: "all"
  mask_prob: 0.15
  spatial_holdout_prob: 0.2
  inductive_holdout_frac: 0.2

model:
  num_nodes: 81
  static_feat_dim: 15
  time_series_dim: 3
  # === LARGE ARCHITECTURE (floral-rain-6) ===
  embedding_dim: 32
  hidden_dim: 64
  num_layers: 3
  # ==========================================
  num_heads: 4
  sparsity_threshold: 0.5
  dropout: 0.1
  dim_feedforward: null
  zinb_eps: 1.0e-6
  edge_features_cache_path: "data/external/edge_features_cache.json"
  simulated_edge_features_cache_path: "data/external/simulated_edge_features_cache.json"

training:
  epochs: 100
  batch_size: 128
  lr: 0.0003
  grad_clip_max_norm: 1.0
  early_stop_patience: 10
  early_stop_min_delta: 0.001

loss:
  w_forecast: 1.0
  w_impute: 1.0
  w_kriging: 0.5

model_type: gnn
eval_mode: inductive
train_split: 0.8
amp: false
